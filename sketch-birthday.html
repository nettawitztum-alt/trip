<title>יום הולדת · ליה & גיל — רשימה משותפת</title>
<style>
  /* ===== iOS design tokens ===== */
  :root{
    --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#787880; /* surface2 used as fill base via color-mix */
    --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.08);
    --ink:#1C1C1E; --muted:rgba(60,60,67,.6); --faint:rgba(60,60,67,.3);
    --line:rgba(60,60,67,.29); --line2:rgba(60,60,67,.13);
    --accent:#FF2D55; --accent-ink:#ffffff; --accent-soft:rgba(255,45,85,.12);
    --tang:#FF9500; --tang-soft:rgba(255,149,0,.14);
    --ok:#34C759; --ok-soft:rgba(52,199,89,.15);
    --danger:#FF3B30;
    --shadow:0 6px 22px rgba(0,0,0,.09),0 1px 4px rgba(0,0,0,.05); --shadow-sm:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.05); --shadow-hero:0 14px 38px color-mix(in srgb,var(--accent) 24%,transparent),0 2px 8px rgba(0,0,0,.06);
    --r:12px;
    --p1:#FF2D55; --p2:#AF52DE; --p3:#FF9500; --p4:#34C759;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#000000; --surface:#1C1C1E; --surface2:#8E8E93;
      --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.18);
      --ink:#FFFFFF; --muted:rgba(235,235,245,.6); --faint:rgba(235,235,245,.3);
      --line:rgba(84,84,88,.65); --line2:rgba(84,84,88,.4);
      --accent:#FF375F; --accent-ink:#ffffff; --accent-soft:rgba(255,55,95,.22);
      --tang:#FF9F0A; --tang-soft:rgba(255,159,10,.22);
      --ok:#30D158; --ok-soft:rgba(48,209,88,.22); --danger:#FF453A;
      --shadow:0 10px 28px rgba(0,0,0,.55),0 1px 4px rgba(0,0,0,.4); --shadow-sm:0 1px 3px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.4); --shadow-hero:0 16px 40px rgba(0,0,0,.6),0 0 0 .5px color-mix(in srgb,var(--accent) 32%,transparent);
      --p1:#FF375F; --p2:#BF5AF2; --p3:#FF9F0A; --p4:#30D158;
    }
  }
  :root[data-theme="light"]{
    --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#787880;
    --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.08);
    --ink:#1C1C1E; --muted:rgba(60,60,67,.6); --faint:rgba(60,60,67,.3);
    --line:rgba(60,60,67,.29); --line2:rgba(60,60,67,.13);
    --accent:#FF2D55; --accent-ink:#ffffff; --accent-soft:rgba(255,45,85,.12);
    --tang:#FF9500; --tang-soft:rgba(255,149,0,.14); --ok:#34C759; --ok-soft:rgba(52,199,89,.15); --danger:#FF3B30;
    --shadow:0 6px 22px rgba(0,0,0,.09),0 1px 4px rgba(0,0,0,.05); --shadow-sm:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.05); --shadow-hero:0 14px 38px color-mix(in srgb,var(--accent) 24%,transparent),0 2px 8px rgba(0,0,0,.06);
    --p1:#FF2D55; --p2:#AF52DE; --p3:#FF9500; --p4:#34C759;
  }
  :root[data-theme="dark"]{
    --bg:#000000; --surface:#1C1C1E; --surface2:#8E8E93;
    --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.18);
    --ink:#FFFFFF; --muted:rgba(235,235,245,.6); --faint:rgba(235,235,245,.3);
    --line:rgba(84,84,88,.65); --line2:rgba(84,84,88,.4);
    --accent:#FF375F; --accent-ink:#ffffff; --accent-soft:rgba(255,55,95,.22);
    --tang:#FF9F0A; --tang-soft:rgba(255,159,10,.22); --ok:#30D158; --ok-soft:rgba(48,209,88,.22); --danger:#FF453A;
    --shadow:0 10px 28px rgba(0,0,0,.55),0 1px 4px rgba(0,0,0,.4); --shadow-sm:0 1px 3px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.4); --shadow-hero:0 16px 40px rgba(0,0,0,.6),0 0 0 .5px color-mix(in srgb,var(--accent) 32%,transparent);
    --p1:#FF375F; --p2:#BF5AF2; --p3:#FF9F0A; --p4:#30D158;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Heebo',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,'Apple Color Emoji','Segoe UI Emoji',sans-serif;
    background:
      radial-gradient(130% 42% at 78% -6%, color-mix(in srgb,var(--accent) 13%, transparent), transparent 68%),
      radial-gradient(120% 40% at 0% -4%, color-mix(in srgb,var(--tang) 9%, transparent), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink); min-height:100vh; padding:0 0 40px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .wrap{max-width:540px;margin:0 auto;padding:0 16px}

  /* iOS large title */
  header.hd{position:relative;padding:calc(56px + env(safe-area-inset-top)) 16px 6px;text-align:right}
  header.hd canvas{display:none}
  .hd .eyebrow{font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted);text-transform:none;margin:0 0 2px}
  .hd h1{margin:0;font-size:34px;font-weight:700;letter-spacing:.37px;line-height:1.1}
  .hd h1 .amp{color:var(--accent)}
  .sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);margin-top:6px}
  .sync .led{width:8px;height:8px;border-radius:99px;background:var(--faint)}
  .sync.on .led{background:var(--ok)}
  .sync.off .led{background:var(--tang)}

  /* iOS segmented control */
  .tabs-wrap{position:sticky;top:0;z-index:15;margin:0 -16px;padding:8px 16px 8px;
    background:color-mix(in srgb,var(--bg) 80%, transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:var(--fill);border-radius:9px;padding:2px}
  .tab{border:none;background:transparent;color:var(--ink);border-radius:7px;padding:7px 6px;font:inherit;
    font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;position:relative;transition:.2s}
  .tab+.tab::before{content:"";position:absolute;right:0;top:20%;height:60%;width:1px;background:var(--line2)}
  .tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:500}
  .tab.active::before,.tab.active+.tab::before{background:transparent}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .people-row{display:flex;align-items:center;gap:8px;margin:2px 0}
  .people{display:flex;flex-wrap:nowrap;gap:6px;justify-content:flex-start;flex:1;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .people::-webkit-scrollbar{display:none}
  .person{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ink);
    background:var(--fill);border:none;border-radius:99px;padding:5px 12px 5px 5px;white-space:nowrap}
  .person.pfilter{cursor:pointer;font-family:inherit}
  .person.pfilter:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .person.active{background:var(--accent);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
  .person .pall{padding:0 5px;font-weight:500}
  .person .av{width:20px;height:20px;border-radius:99px;display:grid;place-items:center;font-size:13px}
  .people-edit{flex:none;width:32px;height:32px;border-radius:99px;background:var(--fill);border:none;
    font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0}
  .people-edit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fbanner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);
    border-radius:var(--r);padding:11px 14px;margin:10px 0 4px;font-size:14px;font-weight:500;color:var(--ink)}
  .fbanner b{color:var(--accent);font-weight:700}
  .fbanner-reset{background:transparent;color:var(--accent);border:none;padding:6px 4px;
    font:inherit;font-size:15px;font-weight:500;cursor:pointer;flex:none}
  .fbanner-reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* slim completed-progress strip */
  .progress{background:var(--surface);border-radius:var(--r);padding:12px 16px;margin:10px 0;box-shadow:var(--shadow-sm)}
  .progress-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;
    color:var(--muted);margin-bottom:9px}
  .progress-n{font-variant-numeric:tabular-nums;color:var(--muted)}
  .progress-n b{color:var(--ink);font-size:15px;font-weight:700}
  .bar{width:100%;height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;border-radius:99px;background:var(--ok);
    transition:width .45s cubic-bezier(.4,0,.2,1)}
  @media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

  .empty{text-align:center;color:var(--muted);font-weight:500;font-size:15px;padding:34px 16px}
  /* the agenda is the hero — elevated with a soft tinted shadow */
  .card.agenda{box-shadow:var(--shadow-hero);margin-top:14px}
  .card.agenda>.chd .ic{background:var(--accent)!important;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
  .card.agenda>.chd h2{color:var(--accent)}
  .agh{font-size:13px;font-weight:500;letter-spacing:0;padding:12px 16px 4px;color:var(--muted)}
  .agh-over{color:var(--danger)}
  .agh-today{color:var(--accent)}
  .agh-tom{color:var(--tang)}
  .subhead{font-size:13px;font-weight:500;color:var(--muted);padding:14px 16px 4px}
  .tag2{font-size:12px;font-weight:500;color:var(--muted);margin-inline-start:6px}
  .itemamts .val{color:var(--tang)}

  /* iOS grouped list card */
  .card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);margin:18px 0 8px;overflow:hidden}
  .card>.chd{display:flex;align-items:center;gap:12px;padding:13px 16px}
  .chd .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;flex:none;color:#fff}
  .chd h2{margin:0;font-size:17px;font-weight:700;flex:1;letter-spacing:-.2px}
  .chd .count{font-size:15px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
  .rows{padding:0}

  .row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;min-height:44px}
  .row+.row::before{content:"";position:absolute;top:0;right:16px;left:0;height:.5px;background:var(--line2)} /* iOS inset separator */
  .row:active{background:var(--fill2)}
  .check{flex:none;width:24px;height:24px;border-radius:50%;border:1.8px solid var(--faint);
    background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;transition:.15s;align-self:flex-start;margin-top:1px}
  .check:hover{border-color:var(--accent)}
  .check svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
    opacity:0;transform:scale(.4);transition:.15s}
  .check:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row.done .check{background:var(--accent);border-color:var(--accent)}
  .row.done .check svg{opacity:1;transform:scale(1)}
  .row.confirmed .check{background:var(--ok);border-color:var(--ok)}
  .row.confirmed .check svg{opacity:1;transform:scale(1)}

  .grow{align-items:center;gap:8px}
  .gnum{flex:none;min-width:26px;height:22px;padding:0 6px;border-radius:6px;background:var(--fill);
    color:var(--muted);font-weight:500;font-size:12px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
  .grow .gname{font-size:16px;font-weight:400}
  .gtog{flex:none;font-size:12px;font-weight:500;border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:99px;padding:5px 10px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
  .gtog:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .gtog.conf.on{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--ok) 35%,transparent)}
  .gtog.arr.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
  .gsum{display:flex;gap:16px;padding:10px 16px;font-size:13px;font-weight:500;border-bottom:.5px solid var(--line2)}
  .gsum .gs-conf{color:var(--ok)}
  .gsum .gs-arr{color:var(--accent)}

  .body{flex:1;min-width:0}
  .txt{font-size:14.5px;font-weight:500;line-height:1.4;word-break:break-word}
  .body{align-self:center}
  .txt{font-size:16px;font-weight:400;line-height:1.3;word-break:break-word;color:var(--ink)}
  .edit-txt{cursor:pointer}
  .subtxt{font-size:14px;font-weight:400;color:var(--muted);line-height:1.3;margin-top:2px;word-break:break-word}
  .row.done .txt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
  .row.done .subtxt{color:var(--faint)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}

  /* iOS inline tags */
  .chip{font-size:13px;font-weight:500;border-radius:7px;padding:2px 8px;cursor:pointer;border:none;
    display:inline-flex;align-items:center;gap:4px;line-height:1.5;font-variant-numeric:tabular-nums;font-family:inherit}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .chip.amt{background:var(--tang-soft);color:var(--tang);font-weight:500}
  .chip.date{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .chip.mini{background:var(--fill);color:var(--muted)}
  .chip.needpay{background:var(--tang-soft);color:var(--tang);font-weight:500}
  .chip.add{background:var(--fill);color:var(--muted)}
  .chip.who{color:#fff;font-weight:500;border-radius:99px;padding:2px 9px 2px 8px}
  .chip.unassigned{background:var(--fill);color:var(--muted)}
  .chip.datein{background:var(--accent-soft);color:var(--accent);border:none;border-radius:7px;padding:3px 9px;
    font:inherit;font-weight:500;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums;color-scheme:light}
  .chip.datein::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6;margin-inline-start:4px}
  .chip.datein::-webkit-date-and-time-value{text-align:right}
  @media (prefers-color-scheme:dark){.chip.datein{color-scheme:dark}}
  :root[data-theme="dark"] .chip.datein{color-scheme:dark}
  :root[data-theme="light"] .chip.datein{color-scheme:light}
  .whowrap{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}

  .chd{cursor:pointer;user-select:none}
  .chd:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
  .chd .caret{flex:none;color:var(--faint);font-size:13px;transition:transform .2s}
  @media (prefers-reduced-motion:reduce){.chd .caret{transition:none}}
  .card.collapsed .chd .caret{transform:rotate(-90deg)}
  .card.collapsed .rows,.card.collapsed .addrow,.card.collapsed .total{display:none}

  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center;z-index:45;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .sheet.show{display:flex}
  .sheet-card{background:var(--surface);width:100%;max-width:540px;border-radius:14px 14px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:sheetUp .28s cubic-bezier(.32,.72,0,1);
    max-height:88vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  @media (prefers-reduced-motion:reduce){.sheet-card{animation:none}}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-title{display:flex;align-items:center;gap:10px;position:sticky;top:-8px;background:var(--surface);padding:14px 0 10px;z-index:3}
  .sheet-title::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:5px;border-radius:99px;background:var(--line)}
  .sheet-ttl{flex:1;text-align:center;font-size:17px;font-weight:500;margin-inline-end:30px}
  .sheet-x{flex:none;width:30px;height:30px;border-radius:99px;border:none;background:var(--fill);color:var(--muted);
    font-size:14px;cursor:pointer;display:grid;place-items:center}
  .sheet-x:hover{background:var(--line2)}
  .sheet-x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pe-wrap{margin-bottom:10px}
  .pe-row{display:flex;align-items:center;gap:10px}
  .pe-emoji{width:48px;height:48px;border-radius:99px;border:none;font-size:24px;cursor:pointer;flex:none;line-height:1;
    box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .pe-emoji:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .pe-name{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
    font:inherit;font-size:15px;font-weight:700;color:var(--ink)}
  .pe-name:focus{outline:none;border-color:var(--accent)}
  .pe-palette{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px;padding:10px;background:var(--surface2);border-radius:12px}
  .pe-opt{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:21px;cursor:pointer;line-height:1}
  .pe-opt:hover{border-color:var(--accent)}
  .pe-opt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .sheet-hint{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 14px;font-weight:400}
  /* compact person pills */
  .sheet-people{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .aperson{display:inline-flex;align-items:center;gap:7px;background:var(--fill);border:none;border-radius:99px;
    padding:6px 14px 6px 7px;font:inherit;font-size:15px;font-weight:400;color:var(--ink);cursor:pointer}
  .aperson:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .aperson.on{background:var(--accent);color:#fff;font-weight:500}
  .aperson .av{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:15px;flex:none}
  .aperson .an{white-space:nowrap}
  .aperson .ck{color:#fff;font-weight:700;font-size:14px}
  .aperson:not(.on) .ck{display:none}
  .sheet-done{margin-top:18px;width:100%;background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;
    padding:15px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 38%,transparent)}
  .sheet-done:active{opacity:.85}
  .sheet-done:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:2px}
  .sheet-lbl{display:block;font-size:13px;font-weight:400;color:var(--muted);margin:16px 4px 6px}
  .sheet-input{width:100%;background:var(--fill);border:none;border-radius:10px;padding:12px 13px;
    font:inherit;font-size:17px;font-weight:400;color:var(--ink)}
  .sheet-input:focus{outline:2px solid var(--accent);outline-offset:0}
  .sheet-input::placeholder{color:var(--faint)}
  .sheet-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sheet-two>div{min-width:0;display:flex;flex-direction:column}
  .sheet-card .sheet-two .sheet-input{width:100%;min-width:0;box-sizing:border-box}
  .sheet-card .sheet-input[type="date"]{-webkit-appearance:none;appearance:none}
  .sheet-attach{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:10px;margin-top:4px}
  .attach-none{font-size:14px;color:var(--faint);font-weight:400}
  .sheet-mini-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .sheet-mini{flex:1;min-width:90px;background:var(--fill);border:none;border-radius:10px;
    padding:11px 8px;font:inherit;font-size:14px;font-weight:500;color:var(--accent);cursor:pointer}
  .sheet-mini:active{background:var(--line2)}
  .sheet-mini:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .sheet-del{margin-top:10px;width:100%;background:var(--fill);color:var(--danger);border:none;
    border-radius:12px;padding:14px;font:inherit;font-size:17px;font-weight:400;cursor:pointer}
  .sheet-del:active{background:var(--line2)}
  .sheet-del:focus-visible{outline:2px solid var(--danger);outline-offset:2px}
  .chip.attach{background:var(--fill);color:var(--muted);border:none;font-size:13px}
  .chip.link{background:color-mix(in srgb,var(--p2) 16%,transparent);color:var(--p2);max-width:160px}
  .chip.link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

  function subscribe(){
    setSync('on','מסונכרן');
    _db.collection('trips').doc(DOC_ID).onSnapshot(function(doc){
      var d=doc.data();
      if(!d||!d.blob){ if(!_synced){_synced=true;pushCloud();} return; } // empty doc: seed it once
      if(d.by===CLIENT){ _synced=true; return; }        // our own echo
      if(d.blob===_lastBlob){ _synced=true; return; }
      // Protect edits I've made but not yet pushed — but only AFTER the first real
      // sync, so a newcomer never overwrites the live list with the default seed.
      if(_pendingLocal && _synced){ clearTimeout(_pushTimer); pushCloud(); return; }
      try{
        var incoming=JSON.parse(d.blob);
        if(incoming&&incoming.sections){
          _applyingRemote=true;
          state=normalize(incoming); _lastBlob=d.blob;
          try{localStorage.setItem(LS,d.blob);}catch(e){}
          render();
          _applyingRemote=false;
        }
      }catch(e){console.warn('bad remote blob',e);}
      _synced=true;
    },function(err){console.warn('snapshot error',err);setSync('off','שגיאת סנכרון');});
  }
  function pushCloud(){
    if(!_db)return;
    var blob=JSON.stringify(state);
    if(blob===_lastBlob){_pendingLocal=false;return;}
    if(blob.length>950000){ // Firestore doc limit ~1MB — keep photos from breaking sync
      _pendingLocal=false;
      setSync('off','תמונות כבדות — לא סונכרן'); toast('התמונות כבדות מדי לסנכרון בענן — נשמרו במכשיר');
      return;
    }
    _lastBlob=blob;
    _db.collection('trips').doc(DOC_ID).set({blob:blob,updatedAt:Date.now(),by:CLIENT},{merge:true})
      .then(function(){_pendingLocal=false;setSync('on','מסונכרן');})
      .catch(function(e){console.warn('push failed',e);setSync('off','שמירה נכשלה');});
  }
  window.addEventListener('pagehide',function(){if(_pushTimer){clearTimeout(_pushTimer);pushCloud();}});

  function personName(id){var p=pById(id);return p?p.name:'';}
  function isoLocal(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function fmtDate(iso){if(!iso)return'';var p=String(iso).split('-');return p.length<3?iso:(p[2]+'/'+p[1]);}
  function cmpItems(a,b){
    if((a.done?1:0)!==(b.done?1:0))return (a.done?1:0)-(b.done?1:0); // undone first
    var ad=a.date||'',bd=b.date||'';                                  // then chronological
    if(ad&&bd)return ad<bd?-1:(ad>bd?1:0);
    if(ad)return -1; if(bd)return 1; return 0;
  }

  function agendaCard(f){
    var today=isoLocal(new Date()); var td=new Date();td.setDate(td.getDate()+1);var tom=isoLocal(td);
    var groups=[
      {key:'over',label:'באיחור',ic:'⚠️',items:[]},
      {key:'today',label:'היום',ic:'📌',items:[]},
      {key:'tom',label:'מחר',ic:'➡️',items:[]}
    ];
    state.sections.forEach(function(sec){ sec.items.forEach(function(i){
      if(i.done||!i.date)return;
      if(f&&(i.whos||[]).indexOf(f)<0)return;
      if(i.date<today)groups[0].items.push([sec,i]);
      else if(i.date===today)groups[1].items.push([sec,i]);
      else if(i.date===tom)groups[2].items.push([sec,i]);
    });});
    var totalDated=groups.reduce(function(a,g){return a+g.items.length;},0);
    var card=el('div','card agenda');
    card.appendChild(html('<div class="chd"><div class="ic" style="background:var(--accent-soft)">📆</div><h2>הפוקוס להיום ומחר</h2>'+
      (totalDated?'<span class="count">'+totalDated+'</span>':'')+'</div>'));
    var wrap=el('div','rows');
    if(!totalDated){
      wrap.appendChild(html('<div class="agenda-empty">אין עדיין משימות עם תאריך לימים הקרובים.<br>הוסיפו 📅 <b>תאריך</b> לפריט (בשורת הכפתורים שלו) והוא יופיע כאן — לפי היום, מחר ובאיחור.</div>'));
    }else{
      groups.forEach(function(g){ if(!g.items.length)return;
        wrap.appendChild(html('<div class="agh agh-'+g.key+'">'+g.ic+' '+g.label+' · '+g.items.length+'</div>'));
        g.items.sort(function(a,b){return a[1].date<b[1].date?-1:(a[1].date>b[1].date?1:0);});
        g.items.forEach(function(pr){ wrap.appendChild(agendaRow(pr[0],pr[1])); });
      });
    }
    card.appendChild(wrap);
    return card; // always open — this is the focus
  }

  function sectionCard(sec,f){
    var list = f ? sec.items.filter(function(i){return (i.whos||[]).indexOf(f)>=0;}) : sec.items;
    if(f && !list.length) return null;
    var left=list.filter(function(i){return !i.done;}).length;
    var card=el('div','card');
    card.appendChild(html('<div class="chd"><div class="ic" style="background:'+sec.bg+'">'+sec.icon+'</div>'+
      '<h2>'+esc(sec.title)+'</h2><span class="count">'+left+' פתוחים</span></div>'));

    list.slice().sort(cmpItems).forEach(function(it){ rows.appendChild(itemRow(sec,it)); });
    card.appendChild(rows);
    var add=el('div','addrow');

    btn.onclick=commit; inp.addEventListener('keydown',function(e){if(e.key==='Enter')commit();});
    add.appendChild(inp);add.appendChild(btn);card.appendChild(add);

      });
      if(unassigned>0)pc.appendChild(html('<div class="paid-row muted"><span class="pl">❗ לא סומן מי שילם</span><span class="pv">'+nfmt(unassigned)+' ₪</span></div>'));
      var pot=payersList.reduce(function(a,p){return a+paid[p.id];},0), n=payersList.length;
      if(n>=2){
        var share=pot/n;
        pc.appendChild(html('<div class="paid-split">חלוקה שווה · <b>'+nfmt(Math.round(share))+' ₪</b> לכל אחד/ת ('+n+' משלמים, מתוך '+nfmt(Math.round(pot))+' ₪)</div>'));
        var transfers=settleTransfers(payersList.map(function(p){return {id:p.id,amt:paid[p.id]-share};}));
        if(transfers.length){
          pc.appendChild(html('<div class="paid-title" style="margin-top:12px">🤝 התחשבנות — מי חייב למי</div>'));
          transfers.forEach(function(t){
            var from=pById(t.from),to=pById(t.to);
            pc.appendChild(html('<div class="settle-row"><span class="pl">'+
              '<b style="color:'+from.c+'">'+esc(from.name)+'</b> <span class="sarr">חייב/ת ל־</span>'+
              '<b style="color:'+to.c+'">'+esc(to.name)+'</b></span>'+
              '<span class="pv">'+nfmt(Math.round(t.amt))+' ₪</span></div>'));
          });
        }else{
          pc.appendChild(html('<div class="paid-split ok">מאוזן ✓ אין מה להחזיר</div>'));
        }
      }
      card.appendChild(pc);
    }
    return card;
  }
  function settleTransfers(bals){
    var cred=[],deb=[];
    bals.forEach(function(b){ if(b.amt>0.5)cred.push({id:b.id,amt:b.amt}); else if(b.amt<-0.5)deb.push({id:b.id,amt:-b.amt}); });
    cred.sort(function(a,b){return b.amt-a.amt;}); deb.sort(function(a,b){return b.amt-a.amt;});
    var res=[],i=0,j=0;
    while(i<deb.length&&j<cred.length){
      var pay=Math.min(deb[i].amt,cred[j].amt);
      if(pay>0.5)res.push({from:deb[i].id,to:cred[j].id,amt:pay});
      deb[i].amt-=pay; cred[j].amt-=pay;
      if(deb[i].amt<=0.5)i++; if(cred[j].amt<=0.5)j++;
    }
    return res;
  }
  function payerChip(x){
    var p=x.payer?pById(x.payer):null;
    if(p){var c=chip('who','');c.style.background=p.c;c.style.color='#fff';
      c.appendChild(html('<span>💳 '+esc(p.name)+'</span>'));c.title='מי שילם';c.onclick=function(){openExpense(x);};return c;}
    var a=chip('add','+ מי שילם');a.onclick=function(){openExpense(x);};return a;
  }
  function payerChipItem(i){
    var p=i.payer?pById(i.payer):null;
    if(p){var c=chip('who','');c.style.background=p.c;c.style.color='#fff';
      c.appendChild(html('<span>💳 '+esc(p.name)+'</span>'));c.title='מי שילם';c.onclick=function(e){e.stopPropagation();openEdit(i);};return c;}
    var a=chip('needpay','💳 מי שילם?');a.onclick=function(e){e.stopPropagation();openEdit(i);};return a;
  }
  /* download an .ics calendar event for a dated item */
  function icsEsc(s){return String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');}
  function addToCalendar(item){
    if(!item.date){toast('הוסיפו תאריך לפריט קודם');return;}
    var start=item.date.replace(/-/g,'');
    var d=new Date(item.date+'T00:00:00'); d.setDate(d.getDate()+1); var end=isoLocal(d).replace(/-/g,'');
    var now=new Date();
    function z(n){return ('0'+n).slice(-2);}
    var stamp=now.getUTCFullYear()+z(now.getUTCMonth()+1)+z(now.getUTCDate())+'T'+z(now.getUTCHours())+z(now.getUTCMinutes())+z(now.getUTCSeconds())+'Z';
    var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//bday-lia-gil//HE','CALSCALE:GREGORIAN','BEGIN:VEVENT',
      'UID:'+item.id+'@bday-lia-gil','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+start,'DTEND;VALUE=DATE:'+end,
      'SUMMARY:'+icsEsc('🎈 '+item.t)];
    if(item.sub)lines.push('DESCRIPTION:'+icsEsc(item.sub));
    lines.push('END:VEVENT','END:VCALENDAR');
    var blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;
    a.download=(item.t||'event').replace(/[^\w֐-׿]+/g,'_').slice(0,40)+'.ics';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},600);
    toast('נוסף ליומן 📅');
  }
  /* edit expense: description + amount + payer */
  var _expTarget=null,_expPayer=null;
  function openExpense(x){
    _expTarget=x;_expPayer=x.payer||null;
    document.getElementById('expDesc').value=x.t||'';
    document.getElementById('expAmt').value=(x.v!=null?String(x.v):'');
    renderPayer();
    document.getElementById('expSheet').classList.add('show');
    setTimeout(function(){document.getElementById('expDesc').focus();},60);
  }
  function closeExpense(){document.getElementById('expSheet').classList.remove('show');_expTarget=null;}
  function renderPayer(){
    var box=document.getElementById('expPayer');box.innerHTML='';
    people.forEach(function(p){
      var on=_expPayer===p.id;
      var b=el('button','aperson'+(on?' on':''));b.type='button';b.setAttribute('aria-pressed',on?'true':'false');
      b.innerHTML='<span class="av" style="background:'+p.c+'">'+p.emoji+'</span>'+
        '<span class="an">'+esc(p.name)+'</span><span class="ck">'+(on?'✓':'')+'</span>';
      b.onclick=function(){_expPayer=(_expPayer===p.id?null:p.id);renderPayer();};
      box.appendChild(b);
    });

  function saveExpense(){
    if(!_expTarget){closeExpense();return;}
    var d=document.getElementById('expDesc').value.trim();
    var a=Math.round(parseFloat((document.getElementById('expAmt').value||'').replace(/[^\d.]/g,''))||0);
    if(d)_expTarget.t=d;
    _expTarget.v=a;
    _expTarget.payer=_expPayer||null;
    save();closeExpense();
  }
  /* people editor — change each person's emoji (and name) */

    if(val)state.people[id][key]=val; else delete state.people[id][key];
    if(!Object.keys(state.people[id]).length)delete state.people[id];

    var box=document.getElementById('peopleEditor');box.innerHTML='';

  function questionCard(){
    var card=el('div','card q');
    card.appendChild(html('<div class="chd"><div class="ic" style="background:var(--accent-soft)">❓</div><h2>שאלות לצוות</h2></div>'));
    var rows=el('div','rows');
    state.questions.forEach(function(qq){
      var r=el('div','row'+(qq.done?' done':''));
      var mark=html('<button class="qmark" type="button" title="סמן כנענה">'+(qq.done?'✓':'?')+'</button>');
      mark.onclick=function(){qq.done=!qq.done;save();};
      r.appendChild(mark);
      var b=el('div','body');b.appendChild(html('<div class="txt">'+esc(qq.t)+'</div>'));
      var meta=el('div','meta');meta.appendChild(whoChip(qq));b.appendChild(meta);
      r.appendChild(b);
      r.appendChild(delBtn('מחיקת שאלה',function(){state.questions=state.questions.filter(function(x){return x!==qq;});save();}));
      rows.appendChild(r);
    });
    card.appendChild(rows);
    var add=el('div','addrow');var inp=inputEl('שאלה חדשה…','שאלה חדשה');var btn=plusBtn();
    function commit(){var v=inp.value.trim();if(!v)return;state.questions.push(q(v));inp.value='';save();}
    btn.onclick=commit;inp.addEventListener('keydown',function(e){if(e.key==='Enter')commit();});
    add.appendChild(inp);add.appendChild(btn);card.appendChild(add);

  function updateSummary(){
    var total=0,done=0;
    state.sections.forEach(function(s){s.items.forEach(function(i){total++;if(i.done)done++;});});
    document.getElementById('doneN').textContent=done;
    document.getElementById('totalN').textContent=total;
    document.getElementById('barFill').style.width=(total?Math.round(done/total*100):0)+'%';

  function renderPeople(){
    var box=document.getElementById('people');box.innerHTML='';
    var all=el('button','person pfilter'+(filterWho?'':' active'));all.type='button';
    all.innerHTML='<span class="pall">הכל</span>';

    box.appendChild(all);
    people.forEach(function(p){
      var n=0;state.sections.forEach(function(s){s.items.forEach(function(i){if((i.whos||[]).indexOf(p.id)>=0)n++;});});

  /* ---------- dates (native, reliable) ---------- */
  function dateControl(item){
    // plain native date field — the browser's own picker; no auto-open, no jump
    var di=document.createElement('input');di.type='date';di.className='chip datein';
    if(item.date)di.value=item.date;
    di.title='תאריך'; di.setAttribute('aria-label','תאריך לפריט: '+item.t);
    di.onchange=function(){item.date=di.value||null;save();};
    return di;
  }

  /* ---------- collapse / expand cards ---------- */
  var COL_LS='bday-collapsed-v1';
  var collapsed=(function(){try{return JSON.parse(localStorage.getItem(COL_LS))||{};}catch(e){return {};}})();
  function saveCollapsed(){try{localStorage.setItem(COL_LS,JSON.stringify(collapsed));}catch(e){}}
  function collapsible(card,key,def){
    var hd=card.querySelector('.chd');if(!hd)return;
    hd.appendChild(html('<span class="caret" aria-hidden="true">▾</span>'));
    var isCol=(key in collapsed)?collapsed[key]:!!def;
    if(isCol)card.classList.add('collapsed');
    hd.setAttribute('role','button');hd.setAttribute('tabindex','0');
    hd.setAttribute('aria-expanded',isCol?'false':'true');
    function toggle(){var c=card.classList.toggle('collapsed');collapsed[key]=c;saveCollapsed();hd.setAttribute('aria-expanded',c?'false':'true');}
    hd.onclick=toggle;
    hd.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}};
  }

  /* ---------- attachments (photos + links) ---------- */
  function thumbEl(item,src,onChange){
    var d=el('div','thumb');d.style.backgroundImage='url("'+src+'")';d.tabIndex=0;
    d.setAttribute('role','button');d.setAttribute('aria-label','תמונה מצורפת — לחצו להגדלה');
    d.onclick=function(){openLightbox(src);};
    d.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openLightbox(src);}};
    var x=el('button','x');x.type='button';x.textContent='✕';x.title='הסרת תמונה';x.setAttribute('aria-label','הסרת תמונה');
    x.onclick=function(e){e.stopPropagation();item.imgs=(item.imgs||[]).filter(function(s){return s!==src;});persistQuiet();(onChange||render)();};
    d.appendChild(x);return d;
  }
  function linkEl(item,url,onChange){
    var wrap=el('span','linkwrap');
    var c=chip('link','');var host=url.replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'');
    c.appendChild(html('<span>🔗 '+esc(host||url)+'</span>'));c.title=url;
    c.onclick=function(){window.open(normUrl(url),'_blank','noopener');};
    var x=el('button','linkx');x.type='button';x.textContent='✕';x.title='הסרת קישור';x.setAttribute('aria-label','הסרת קישור');
    x.onclick=function(){item.links=(item.links||[]).filter(function(u){return u!==url;});persistQuiet();(onChange||render)();};
    wrap.appendChild(c);wrap.appendChild(x);return wrap;
  }
  function normUrl(u){return /^https?:\/\//i.test(u)?u:'https://'+u;}
  function addLink(item,onChange){
    var u=window.prompt('הדביקו קישור לפריט: '+item.t,'https://');
    if(u===null)return;u=u.trim();if(!u||u==='https://')return;
    item.links=item.links||[];item.links.push(u);persistQuiet();(onChange||render)();
  }
  function pickImage(item,onChange){
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;
      compressImg(f,function(dataUrl){ if(!dataUrl){toast('לא ניתן לטעון את התמונה');return;}
        item.imgs=item.imgs||[];item.imgs.push(dataUrl);persistQuiet();(onChange||render)();toast('התמונה נוספה ✓'); }); };
    inp.click();
  }
  function compressImg(file,cb){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var max=420,w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,max/Math.max(w,h));
      var cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));
      var c=document.createElement('canvas');c.width=cw;c.height=ch;
      c.getContext('2d').drawImage(img,0,0,cw,ch);
      URL.revokeObjectURL(url);
      try{cb(c.toDataURL('image/jpeg',0.55));}catch(e){cb(null);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);cb(null);};
    img.src=url;
  }
  function openLightbox(src){var lb=document.getElementById('lightbox');document.getElementById('lbImg').src=src;lb.classList.add('show');}
  function closeLb(){document.getElementById('lightbox').classList.remove('show');document.getElementById('lbImg').src='';}
  document.getElementById('lbClose').onclick=closeLb;
  document.getElementById('lightbox').onclick=function(e){if(e.target.id==='lightbox')closeLb();};
  document.getElementById('assignDone').onclick=closeAssign;
  document.getElementById('assignSheet').onclick=function(e){if(e.target.id==='assignSheet')closeAssign();};
  document.getElementById('editSave').onclick=saveEdit;
  document.getElementById('editDelete').onclick=function(){if(!_editTarget)return;
    var sec=sectionOf(_editTarget); if(sec)sec.items=sec.items.filter(function(x){return x!==_editTarget;});
    save();closeEdit();};
  document.getElementById('editAddImg').onclick=function(){if(_editTarget)pickImage(_editTarget,renderEditAttach);};
  document.getElementById('editAddLink').onclick=function(){if(_editTarget)addLink(_editTarget,renderEditAttach);};
  document.getElementById('editAddCal').onclick=function(){if(!_editTarget)return;
    var d=document.getElementById('editDate').value; if(d)_editTarget.date=d; // use the date shown in the sheet
    addToCalendar(_editTarget);};
  document.getElementById('editSheet').onclick=function(e){if(e.target.id==='editSheet')closeEdit();};
  document.getElementById('expSave').onclick=saveExpense;
  document.getElementById('expDel').onclick=function(){if(!_expTarget)return;state.expenses=state.expenses.filter(function(e){return e!==_expTarget;});save();closeExpense();};
  document.getElementById('expSheet').onclick=function(e){if(e.target.id==='expSheet')closeExpense();};
  document.getElementById('expAmt').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();saveExpense();}});
  document.getElementById('editTitle').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();document.getElementById('editSub').focus();}});
  // people editor + all close (✕) buttons
  document.getElementById('peopleEditBtn').onclick=openPeople;
  document.getElementById('peopleDone').onclick=closePeople;
  document.getElementById('peopleSheet').onclick=function(e){if(e.target.id==='peopleSheet')closePeople();};
  document.getElementById('editX').onclick=closeEdit;
  document.getElementById('expX').onclick=closeExpense;
  document.getElementById('assignX').onclick=closeAssign;
  document.getElementById('peopleX').onclick=closePeople;
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeLb();closeAssign();closeEdit();closeExpense();closePeople();}});
  (function(){var tabs=document.querySelectorAll('#tabs .tab');
    for(var i=0;i<tabs.length;i++){(function(t){t.onclick=function(){activeTab=t.getAttribute('data-tab');render();window.scrollTo(0,0);};})(tabs[i]);}})();

  /* ---------- share ---------- */
  document.getElementById('shareBtn').onclick=function(){
    var url=location.href.split('#')[0];
    if(navigator.share){navigator.share({title:'רשימה משותפת · יום הולדת ליה & גיל',url:url}).catch(function(){});return;}
    if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){toast('הקישור הועתק ✓');},function(){toast(url);});}
    else{window.prompt('העתיקו את הקישור:',url);}
  };
  function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
    clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},1900);}

  /* ---------- helpers ---------- */
  function el(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;return e;}
  function html(s){var t=document.createElement('template');t.innerHTML=s.trim();return t.content.firstChild;}
  function chip(cls,txt){var c=document.createElement('button');c.className='chip '+cls;c.type='button';if(txt)c.textContent=txt;return c;}
  function inputEl(ph,label){var i=document.createElement('input');i.placeholder=ph;i.setAttribute('aria-label',label);return i;}
  function plusBtn(){var b=document.createElement('button');b.type='button';b.textContent='+';b.title='הוסף';return b;}
  function delBtn(label,fn){var b=document.createElement('button');b.className='del';b.type='button';b.textContent='✕';
    b.setAttribute('aria-label',label);b.onclick=function(e){e.stopPropagation();fn();};return b;}
  function iconBtn(cls,icon,label,fn){var b=document.createElement('button');b.className='del '+cls;b.type='button';
    b.textContent=icon;b.title=label;b.setAttribute('aria-label',label);b.onclick=function(e){e.stopPropagation();fn();};return b;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}

  /* ---------- theme ---------- */
  var tbtn=document.getElementById('themeBtn');
  function curDark(){var r=document.documentElement;if(r.getAttribute('data-theme'))return r.getAttribute('data-theme')==='dark';
    return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;}
  function syncIcon(){tbtn.textContent=curDark()?'☀️':'🌙';}
  tbtn.onclick=function(){document.documentElement.setAttribute('data-theme',curDark()?'light':'dark');syncIcon();};
  syncIcon();

  /* ---------- confetti ---------- */
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var cv=document.getElementById('confetti'),ctx=cv.getContext('2d'),parts=[];
  var cols=['#e6457f','#ff8a3d','#6a5cff','#12996a','#ffd23d'];
  function seedC(){parts=[];for(var i=0;i<26;i++)parts.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
    r:3+Math.random()*4,c:cols[i%cols.length],vy:.2+Math.random()*.5,a:Math.random()*Math.PI,va:(Math.random()-.5)*.05});}
  function sizeC(){var p=cv.parentElement;cv.width=p.clientWidth;cv.height=p.clientHeight;seedC();}
  function draw(){ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<parts.length;i++){var p=parts[i];
      if(!reduce){p.y+=p.vy;p.a+=p.va;if(p.y>cv.height+8){p.y=-8;p.x=Math.random()*cv.width;}}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=.75;ctx.fillStyle=p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore();}
    if(!reduce)requestAnimationFrame(draw);}
  window.addEventListener('resize',sizeC);sizeC();draw();
  function burst(){if(reduce)return;for(var i=0;i<10;i++)parts.push({x:cv.width/2,y:cv.height*.7,r:3+Math.random()*3,
    c:cols[i%cols.length],vy:-(1+Math.random()*2),a:Math.random()*6,va:(Math.random()-.5)*.2});
    setTimeout(function(){parts=parts.slice(-40);},1200);}

  /* ---------- go ---------- */
  render();
  setSync('off','מתחבר…');
  initFirebase();
})();
</script>
